<!doctype html><html lang="vi"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Be+Vietnam+Pro:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#e9e9e6;font-family:'Be Vietnam Pro',sans-serif;color:#141414}
.sheet{margin:48px 18px 0;background:#fff;padding:18px 20px 22px;border-top:10px dotted #c9c9c4;text-align:center}
.mo{display:flex;justify-content:space-between;font-weight:700;font-size:13px;letter-spacing:.08em}
.mo span:last-child{color:#d7261e}
.n{font-family:'Anton';font-size:200px;line-height:1;color:#d7261e;margin:6px 0 0}
.d{font-size:22px;font-weight:700;color:#d7261e}
.am{font-size:12px;color:#1b4fa0;margin-top:4px}
hr{border:0;border-top:2px solid #141414;margin:16px 0}
h1{font-family:'Anton';font-size:34px;font-weight:400;letter-spacing:.02em}
.m{display:flex;justify-content:center;gap:22px;margin-top:8px;font-size:15px}
.m b{font-size:22px}
.wk{display:flex;gap:6px;margin:18px 18px 0}
.wk div{flex:1;background:#fff;height:78px;text-align:center;padding-top:8px;font-size:11px;font-weight:700}
.wk div b{display:block;font-family:'Anton';font-size:26px;font-weight:400;margin-top:4px}
.wk .t{opacity:.35;text-decoration:line-through}
.wk .now{outline:3px solid #d7261e}
.wk .rest b{color:#9a9a96}
.go{position:absolute;left:18px;right:18px;bottom:34px;height:60px;background:#141414;color:#fff;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center}
</style></head><body>
<div class="sheet">
<div class="mo"><span>THÁNG 11 · 2026</span><span>THỨ TƯ</span></div>
<div class="n">04</div>
<div class="d">Buổi tập 2/3 tuần này</div>
<div class="am">Chuỗi: 7 buổi liên tiếp</div>
<hr>
<h1>TOÀN THÂN B</h1>
<div class="m"><span><b>45</b> phút</span><span><b>~150</b> kcal</span><span><b>6</b> bài</span></div>
</div>
<div class="wk">
<div class="t">T2<b>02</b></div><div class="rest">T3<b>03</b></div><div class="now">T4<b>04</b></div><div class="rest">T5<b>05</b></div><div>T6<b>06</b></div><div class="rest">T7<b>07</b></div><div class="rest">CN<b>08</b></div>
</div>
<div class="go">XÉ TỜ HÔM NAY · BẮT ĐẦU</div>
</body></html>
