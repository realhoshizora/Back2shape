<!doctype html><html lang="vi"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#0b0b0c;color:#fff;font-family:'Be Vietnam Pro',sans-serif;position:relative}
.bar{display:flex;gap:4px;padding:52px 16px 0}.bar i{flex:1;height:4px;border-radius:2px;background:#3a3a40}.bar i.d{background:#fff}.bar i.n{background:#2ee59d}
.top{display:flex;justify-content:space-between;padding:14px 18px;font-size:14px;color:#c9c9cf}
.big{position:absolute;top:210px;left:0;right:70px;text-align:center}
.big b{font-size:190px;font-weight:900;line-height:1}
.big span{display:block;font-size:16px;color:#c9c9cf;margin-top:-6px}
.rail{position:absolute;right:14px;top:300px;display:flex;flex-direction:column;gap:26px;align-items:center;font-size:11px;color:#c9c9cf}
.rail div{text-align:center}.rail em{display:block;width:50px;height:50px;border-radius:50%;background:#26262b;margin-bottom:6px}
.rail .ok em{background:#2ee59d}
.cap{position:absolute;left:0;right:0;bottom:0;padding:90px 18px 42px;background:linear-gradient(transparent,#000 45%)}
.cap small{color:#2ee59d;font-weight:700;font-size:13px}
.cap h1{font-size:30px;font-weight:900;margin:4px 0 6px}
.cap p{font-size:15px;color:#c9c9cf;max-width:290px}
</style></head><body>
<div class="bar"><i class="d"></i><i class="n"></i><i></i><i></i><i></i><i></i></div>
<div class="top"><span>Toàn thân B · 12:40</span><span>🔥 7</span></div>
<div class="big"><b>10</b><span>lần · hiệp 2/3</span></div>
<div class="rail"><div class="ok"><em></em>Xong</div><div><em></em>Nghỉ</div><div><em></em>Bỏ qua</div></div>
<div class="cap"><small>BÀI 2/6 · LẦN TRƯỚC: 9, 8, 7</small><h1>Hít đất nghiêng</h1><p>Tay đặt trên ghế, thân thẳng. Hạ xuống 3 giây, đẩy lên nhanh.</p></div>
</body></html>
