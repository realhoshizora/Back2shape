<!doctype html><html lang="vi"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,system-ui,sans-serif;padding:56px 16px 0}
h1{font-size:32px;font-weight:800}
.sub{color:#8e8e93;font-size:15px;margin:2px 0 18px}
.sum{background:#1c1c1e;border-radius:18px;padding:18px;display:flex;gap:18px;align-items:center}
.ring{width:96px;height:96px;border-radius:50%;background:conic-gradient(#0a84ff 0 66%,#2c2c2e 0);display:flex;align-items:center;justify-content:center}
.ring div{width:72px;height:72px;border-radius:50%;background:#1c1c1e;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px}
.stats div{font-size:13px;color:#8e8e93;margin-bottom:6px}.stats b{display:block;color:#fff;font-size:20px}
h2{font-size:20px;margin:24px 0 10px}
.c{background:#1c1c1e;border-radius:14px;padding:14px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.c small{display:block;color:#8e8e93;font-size:13px;margin-top:2px}
.c i{width:24px;height:24px;border-radius:50%;border:2px solid #3a3a3c}.c i.ok{background:#30d158;border-color:#30d158}
.go{position:absolute;left:16px;right:16px;bottom:34px;height:56px;border-radius:14px;background:#0a84ff;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center}
</style></head><body>
<h1>Tuần này</h1><div class="sub">Thứ Tư, 4 tháng 11</div>
<div class="sum"><div class="ring"><div>2/3</div></div>
<div class="stats"><div>Chuỗi<b>7 buổi</b></div><div>Đã đốt<b>298 kcal</b></div></div></div>
<h2>Lịch tập</h2>
<div class="c"><div>Thứ Hai · Toàn thân A<small>46 phút · 151 kcal</small></div><i class="ok"></i></div>
<div class="c"><div>Thứ Tư · Toàn thân B<small>45 phút · ~150 kcal</small></div><i></i></div>
<div class="c"><div>Thứ Sáu · Toàn thân A<small>45 phút · ~150 kcal</small></div><i></i></div>
<div class="go">Bắt đầu Toàn thân B</div>
</body></html>
